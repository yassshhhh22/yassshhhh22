name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: patch to dark mode
        run: |
          cd dist
          # Replace light background with dark
          sed -i 's/background-color: #[a-fA-F0-9]\{3,6\}/background-color: #0D1117/g' pacman-contribution-graph.svg
          sed -i 's/background:#[a-fA-F0-9]\{3,6\}/background:#0D1117/g' pacman-contribution-graph.svg
          # Replace light gray empty cells with dark gray
          sed -i 's/fill="#ebedf0"/fill="#161B22"/g' pacman-contribution-graph.svg
          sed -i 's/fill="#[eE][bB][eE][dD][fF]0"/fill="#161B22"/g' pacman-contribution-graph.svg
          # Replace wall/border colors from black to subtle gray for dark bg
          sed -i 's/stroke="#000000"/stroke="#30363D"/g' pacman-contribution-graph.svg
          sed -i 's/stroke="#000"/stroke="#30363D"/g' pacman-contribution-graph.svg
          # Replace any white/light backgrounds in rect or svg elements
          sed -i 's/fill="#[fF]\{3,6\}"/fill="#0D1117"/g' pacman-contribution-graph.svg
          sed -i 's/fill="white"/fill="#0D1117"/g' pacman-contribution-graph.svg
          # Replace light text with white text
          sed -i 's/fill="#24292e"/fill="#C9D1D9"/g' pacman-contribution-graph.svg
          sed -i 's/fill="#24292f"/fill="#C9D1D9"/g' pacman-contribution-graph.svg

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
