name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: patch dark background
        run: |
          FILE="dist/pacman-contribution-graph.svg"
          if [ -f "$FILE" ]; then
            # Inject dark background style into the SVG root element
            sed -i 's/<svg /<svg style="background-color:#0D1117" /' "$FILE"
            # Swap light empty-cell gray to dark
            sed -i 's/#ebedf0/#161B22/g' "$FILE"
            # Swap dark text color to light
            sed -i 's/#24292e/#C9D1D9/g' "$FILE"
            sed -i 's/#24292f/#C9D1D9/g' "$FILE"
          fi

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
