name: refresh profile stats

on:
  push:
    paths:
      - "scripts/generate_stats.py"
      - "scripts/fonts/**"
      - ".github/workflows/stats.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit generated SVGs
        shell: bash
        run: |
          FILES="stats.svg streak.svg langs.svg hd-about.svg hd-stack.svg hd-projects.svg hd-stats.svg"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No SVG changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
